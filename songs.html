<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Catalog - Mr. Karaoke Houston Clone</title>
  <style>
    body { 
      background-image: linear-gradient(135deg, rgba(88, 28, 135, 0.45) 0%, rgba(5, 5, 8, 0.85) 60%), url('bg.jpg');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-color: #050508; 
      color: #f4f4f5; 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 0; 
    }
    body { background-color:#050508; color:#f4f4f5; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:0; }
     nav { background-color: rgba(5, 5, 8, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #14141f; position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
    .nav-links a { color: #a1a1aa; text-decoration: none; font-size: 14px; font-weight: 500; margin: 0 16px; transition: color 0.2s; }
    .nav-links a:hover { color: #ffffff; }
    .phone-btn { background-color: #ef4444; color: #ffffff; padding: 10px 22px; border-radius: 9999px; text-decoration: none; font-weight: 800; font-size: 14px; }
    .section-container { 
      max-width: 800px; 
      margin: 80px auto; 
      padding: 60px 24px; 
      background: radial-gradient(circle at center, rgba(147, 51, 234, 0.35) 0%, rgba(239, 68, 68, 0.15) 40%, transparent 75%); 
      position: relative;
    }
    .page-title { font-size:36px; font-weight:900; text-transform:uppercase; text-align:center; margin-bottom:20px; }
    .red-text { color:#ef4444; }
    input { width: 100%; padding: 16px; background-color: rgba(15, 15, 23, 0.65); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(8px); border-radius: 12px; color: white; box-sizing: border-box; outline: none; font-size: 16px; margin-bottom: 32px; }
    input:focus { border-color:#ef4444; }
    .song-row { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; background-color: rgba(15, 15, 23, 0.45); backdrop-filter: blur(12px); margin-bottom: 4px; border-radius: 8px; }
    .song-title { font-weight:bold; color:#fff; }
    .artist-name { color:#71717a; font-size:14px; }
  </style>
</head>
<body>

    <!-- FULLY MATCHED PRO STAGE HEADER MENU NAVIGATION -->
  <nav>
    <div class="nav-container">
      <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
        <img src="logo.png" alt="Mr. Karaoke Houston Logo" style="height: 50px; width: auto; object-fit: contain;">
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="schedule.html">Schedule</a>
        <a href="songs.html">Song List</a>
        <a href="contact.html">Contact</a>
      </div>
      <a href="tel:7136894210" class="phone-btn">713-689-4210</a>
    </div>
  </nav>


  <div class="section-container">
    <h1 class="page-title">Search <span class="red-text">Song Library</span></h1>
    <input type="text" id="catalogSearch" placeholder="Type artist name or song title...">
    <div id="resultsContainer"></div>
  </div>

  <script>
    const searchBar = document.getElementById('catalogSearch');
    
    async function searchSongs() {
      try {
        const res = await fetch(`http://localhost:5000/api/songs?q=${encodeURIComponent(searchBar.value)}`);
        const songs = await res.json();
        const container = document.getElementById('resultsContainer');
        
        if (songs.length === 0) {
          container.innerHTML = "<p style='color:#71717a; text-align:center;'>No matching songs found.</p>";
          return;
        }

        container.innerHTML = songs.map(s => `
          <div class="song-row">
            <span class="song-title">${s.title}</span>
            <span class="artist-name">${s.artist}</span>
          </div>
        `).join('');
      } catch(e) {}
    }

    searchBar.addEventListener('keyup', searchSongs);
    window.addEventListener('DOMContentLoaded', searchSongs);
  </script>
</body>
</html>
